    <div class="date-input" [class.open]="open()" [class.sm]="size() === 'sm'" [class.disabled]="disabled()">
      <div class="date-trigger" [class.is-disabled]="disabled()" (click)="focusText($event)">
        <input
          #textInput
          class="date-text"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="10"
          [disabled]="disabled()"
          [value]="text()"
          [placeholder]="placeholder() || 'kk.oo.yyyy'"
          (input)="onTextInput($event)"
          (blur)="onTextBlur()"
          (keydown.enter)="onTextBlur(); $event.preventDefault()"
          (keydown.arrowdown)="openPanel(); $event.preventDefault()"
          [attr.aria-label]="'select_date' | t"
        />
        @if (mode() === 'datetime' && hasValue()) {
          <span class="date-time-suffix">{{ timePart() }}</span>
        }
        <button
          type="button"
          class="date-icon"
          [disabled]="disabled()"
          (click)="toggle(); $event.stopPropagation()"
          [attr.aria-expanded]="open()"
          [attr.aria-haspopup]="'dialog'"
          [attr.data-tip]="'select_date' | t"
        >
          <ui-icon name="calendar" [size]="size() === 'sm' ? 14 : 16" />
        </button>
      </div>

      @if (open()) {
        <div class="date-panel" [style.top.px]="panelPos().top" [style.left.px]="panelPos().left" [style.visibility]="panelPos().ready ? 'visible' : 'hidden'" role="dialog" [attr.aria-label]="'select_date' | t">
          <div class="date-head">
            <button type="button" class="date-nav" (click)="shiftMonth(-1)" [attr.data-tip]="'prev' | t">
              <ui-icon name="chevron-left" [size]="16" />
            </button>
            <div class="date-title">{{ monthLabel() }}</div>
            <button type="button" class="date-nav" (click)="shiftMonth(1)" [attr.data-tip]="'next' | t">
              <ui-icon name="chevron-right" [size]="16" />
            </button>
          </div>

          <div class="date-weekdays">
            @for (w of weekdays(); track w) { <span>{{ w }}</span> }
          </div>

          <div class="date-grid">
            @for (cell of cells(); track cell.iso + cell.day) {
              <button
                type="button"
                class="date-day"
                [class.muted]="cell.muted"
                [class.today]="cell.today"
                [class.selected]="cell.selected"
                (click)="pick(cell.iso)"
              >{{ cell.day }}</button>
            }
          </div>

          @if (mode() === 'datetime') {
            <div class="date-time">
              <label class="date-time-label">{{ 'time' | t }}</label>
              <input class="date-time-input" type="time" [value]="timePart()" (input)="onTimeInput($event)" />
            </div>
          }

          <div class="date-foot">
            <button type="button" class="date-link" (click)="pickToday()">{{ 'today' | t }}</button>
            @if (hasValue()) {
              <button type="button" class="date-link muted" (click)="clear()">{{ 'clear' | t }}</button>
            }
          </div>
        </div>
      }
    </div>
